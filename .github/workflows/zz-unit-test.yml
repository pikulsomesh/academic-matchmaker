name: Temporary per-university ingest test (removed before merge)
on:
  push:
    branches: [claude/project-thread-cv0jva]
    paths: [.github/workflows/zz-unit-test.yml]
jobs:
  ingest:
    name: ingest ${{ matrix.unit.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        unit: [{"key":"massachusetts-institute-of-technology","name":"Massachusetts Institute of Technology","legacy_shard":0},{"key":"universidad-de-buenos-aires","name":"Universidad de Buenos Aires","legacy_shard":33}]
    env:
      OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # Ingestion needs only these two; the full requirements (onnxruntime, numpy) are for the publish job.
      - run: pip install "requests>=2.31" "beautifulsoup4>=4.12"

      # The second pattern is the old layout (one cache per position % 50 shard), used once per university
      # until it has a cache of its own; --prune-cache then drops the other university's entries.
      - name: Restore ingestion cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/ingestion
          key: ingestion-uni-${{ matrix.unit.key }}--${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ingestion-uni-${{ matrix.unit.key }}--
            ingestion-shard-${{ matrix.unit.legacy_shard }}-

      - name: Ingest this university
        timeout-minutes: 300
        env:
          UNIVERSITY: ${{ matrix.unit.name }}
        run: |
          set +e
          python scripts/initial_ingestion.py --only "$UNIVERSITY" --prune-cache --dirty-marker .cache/ingestion.dirty \
            --partial-out "partials/partial-${{ matrix.unit.key }}.json" \
            --per-institution "1000" \
            --min-works "20" --min-citations "500" \
            --min-h-index "10" --window-years "10" \
            --openalex-per-second 0.5 --web-per-second 3 --workers 8 \
            --max-openalex-requests "900" \
            --time-budget-minutes 60
          code=$?
          if [ "$code" = 75 ]; then
            echo "::notice::$UNIVERSITY paused with progress cached; the next run resumes it."
            exit 0
          fi
          exit $code

      # Saved only when something was added or pruned; a fully cached university adds no new cache entry.
      - name: Save ingestion cache
        if: always() && hashFiles('.cache/ingestion.dirty') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/ingestion
          key: ingestion-uni-${{ matrix.unit.key }}--${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep this university's result
        uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.unit.key }}
          path: partials/partial-${{ matrix.unit.key }}.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Show what happened
        if: always()
        run: |
          ls -la .cache || true
          du -sh .cache/ingestion || true
          find .cache/ingestion -type f | cut -d/ -f3 | sort | uniq -c || true
          python -c "import json;d=json.load(open('partials/partial-${{ matrix.unit.key }}.json'));print(d['universities'], d['openalex_requests'], len(d['records']))" || true
