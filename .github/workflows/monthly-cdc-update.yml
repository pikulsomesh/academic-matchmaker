name: Monthly data update

on:
  schedule:
    - cron: '0 0 1 * *'   # monthly CDC update
    - cron: '0 2 * * *'   # daily: continue expanding coverage while scripts/config/coverage.json asks for more
  # Merging a change to the build plan or coverage target starts a run right away.
  push:
    branches: [main]
    paths: [scripts/plan_run.py, scripts/config/coverage.json]
  workflow_dispatch:
    inputs:
      mode:
        description: "cdc = add works published since the last run; full = rebuild the whole index"
        type: choice
        options: [cdc, full]
        default: cdc
      per_institution:
        description: "full mode only: max faculty per institution"
        default: "200"

permissions:
  contents: write
  actions: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # Decides full / cdc / skip; see scripts/plan_run.py.
      - name: Plan
        id: plan
        run: >
          python scripts/plan_run.py --event "${{ github.event_name }}" --schedule "${{ github.event.schedule }}"
          --mode "${{ inputs.mode }}" --per-institution "${{ inputs.per_institution }}"

      - run: pip install -r scripts/requirements.txt
        if: steps.plan.outputs.mode != 'skip'

      - name: Cache embedding model
        if: steps.plan.outputs.mode != 'skip'
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: minilm-l6-v2-onnx-fp32

      # A full build can outlast one job (time limit) or one day of OpenAlex budget. It then
      # pauses with its responses cached; the next run (the daily schedule, or a manual re-run)
      # restores that cache and resumes where it stopped.
      - name: Restore ingestion cache
        if: steps.plan.outputs.mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: .cache/ingestion
          key: ingestion-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ingestion-

      - name: Full ingestion
        id: ingest
        if: steps.plan.outputs.mode == 'full'
        timeout-minutes: 300
        run: |
          set +e
          python scripts/initial_ingestion.py --per-institution "${{ steps.plan.outputs.per_institution }}" \
            --min-works "${{ steps.plan.outputs.min_works }}" --min-citations "${{ steps.plan.outputs.min_citations }}" \
            --min-h-index "${{ steps.plan.outputs.min_h_index }}" --window-years "${{ steps.plan.outputs.window_years }}" \
            --size-budget-mb "${{ steps.plan.outputs.size_budget_mb }}" --search-index-rows "${{ steps.plan.outputs.search_index_rows }}" \
            --time-budget-minutes 270
          code=$?
          if [ "$code" = 75 ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Build paused with progress cached; the next run resumes it."
            exit 0
          fi
          exit $code

      - name: Save ingestion cache
        if: always() && steps.plan.outputs.mode == 'full'
        uses: actions/cache/save@v4
        with:
          path: .cache/ingestion
          key: ingestion-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Monthly CDC update
        if: steps.plan.outputs.mode == 'cdc'
        run: python scripts/cdc_update.py

      - name: Build search index
        if: steps.plan.outputs.mode != 'skip' && steps.ingest.outputs.paused != 'true'
        run: python scripts/build_search_index.py

      - name: Commit updated data
        id: commit
        if: steps.plan.outputs.mode != 'skip' && steps.ingest.outputs.paused != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data scripts/config
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "data: ${{ steps.plan.outputs.mode }} update $(date -u +%Y-%m-%d)"
            # main may have moved during a long build; data files are only written here.
            git pull --rebase origin "${{ github.ref_name }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the
      # Pages deployment explicitly (workflow_dispatch is the documented exception).
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
