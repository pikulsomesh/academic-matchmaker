name: Monthly data update

on:
  schedule:
    - cron: '0 0 1 * *'   # monthly CDC update
    - cron: '0 2 * * *'   # daily: continue expanding coverage while scripts/config/coverage.json asks for more
  # Merging a change to the build plan or coverage target starts a run right away.
  push:
    branches: [main]
    paths: [scripts/plan_run.py, scripts/config/coverage.json]
  workflow_dispatch:
    inputs:
      mode:
        description: "cdc = add works published since the last run; full = rebuild the whole index"
        type: choice
        options: [cdc, full]
        default: cdc
      per_institution:
        description: "full mode only: max faculty per institution"
        default: "200"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  # Decides what this run does (full, cdc or skip) and how to split a full build; see scripts/plan_run.py.
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      per_institution: ${{ steps.plan.outputs.per_institution }}
      min_works: ${{ steps.plan.outputs.min_works }}
      min_citations: ${{ steps.plan.outputs.min_citations }}
      min_h_index: ${{ steps.plan.outputs.min_h_index }}
      window_years: ${{ steps.plan.outputs.window_years }}
      size_budget_mb: ${{ steps.plan.outputs.size_budget_mb }}
      search_index_rows: ${{ steps.plan.outputs.search_index_rows }}
      units: ${{ steps.plan.outputs.units }}
      jobs: ${{ steps.plan.outputs.jobs }}
      request_cap: ${{ steps.plan.outputs.request_cap }}
      hf_empty: ${{ steps.hf_pull.outputs.empty }}
    env:
      # Optional Hugging Face hosting: with both set, the data lives in that dataset repo instead of
      # being committed to public/data (scripts/hf_sync.py), and the size budget grows to
      # hosted_size_budget_mb. Without them everything works as before.
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The published data (and its metadata.json, which the plan reads) lives in the dataset.
      - name: Pull data from Hugging Face
        id: hf_pull
        if: env.HF_DATASET_REPO != ''
        run: |
          pip install "huggingface_hub>=0.25"
          python scripts/hf_sync.py pull

      - name: Plan
        id: plan
        run: >
          python scripts/plan_run.py --event "${{ github.event_name }}" --schedule "${{ github.event.schedule }}"
          --mode "${{ inputs.mode }}" --per-institution "${{ inputs.per_institution }}"

  # A full build runs one job per university, 20 at a time. Each university keeps its own cache
  # (ingestion-uni-<name>--...), so adding universities never moves anyone's progress. A job that hangs or
  # hits its time budget only delays its own university; the next run finishes it. Nothing is published
  # until every university has finished.
  ingest:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: ingest ${{ matrix.unit.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    env:
      OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # Ingestion needs only these two; the full requirements (onnxruntime, numpy) are for the publish job.
      - run: pip install "requests>=2.31" "beautifulsoup4>=4.12"

      # The second pattern is the old layout (one cache per position % 50 shard), used once per university
      # until it has a cache of its own; --prune-cache then drops the other university's entries.
      - name: Restore ingestion cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/ingestion
          key: ingestion-uni-${{ matrix.unit.key }}--${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ingestion-uni-${{ matrix.unit.key }}--
            ingestion-shard-${{ matrix.unit.legacy_shard }}-

      - name: Ingest this university
        timeout-minutes: 300
        env:
          UNIVERSITY: ${{ matrix.unit.name }}
        run: |
          set +e
          python scripts/initial_ingestion.py --only "$UNIVERSITY" --prune-cache --dirty-marker .cache/ingestion.dirty \
            --partial-out "partials/partial-${{ matrix.unit.key }}.json" \
            --per-institution "${{ needs.plan.outputs.per_institution }}" \
            --min-works "${{ needs.plan.outputs.min_works }}" --min-citations "${{ needs.plan.outputs.min_citations }}" \
            --min-h-index "${{ needs.plan.outputs.min_h_index }}" --window-years "${{ needs.plan.outputs.window_years }}" \
            --openalex-per-second 0.5 --web-per-second 3 --workers 8 \
            --max-openalex-requests "${{ needs.plan.outputs.request_cap }}" \
            --time-budget-minutes 270
          code=$?
          if [ "$code" = 75 ]; then
            echo "::notice::$UNIVERSITY paused with progress cached; the next run resumes it."
            exit 0
          fi
          exit $code

      # Saved only when something was added or pruned; a fully cached university adds no new cache entry.
      - name: Save ingestion cache
        if: always() && hashFiles('.cache/ingestion.dirty') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/ingestion
          key: ingestion-uni-${{ matrix.unit.key }}--${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep this university's result
        uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.unit.key }}
          path: partials/partial-${{ matrix.unit.key }}.json
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: [plan, ingest]
    if: >
      always() && needs.plan.result == 'success' && (needs.ingest.result == 'success' || needs.ingest.result == 'skipped')
      && (needs.plan.outputs.mode != 'skip' || needs.plan.outputs.hf_empty == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Pull data from Hugging Face
        id: hf_pull
        if: env.HF_DATASET_REPO != ''
        run: |
          pip install "huggingface_hub>=0.25"
          python scripts/hf_sync.py pull

      - run: pip install -r scripts/requirements.txt
        if: needs.plan.outputs.mode != 'skip'

      # Remember what is published now, so the quality gate can tell if the new build lost people.
      - name: Snapshot current data
        if: needs.plan.outputs.mode != 'skip'
        run: python scripts/quality_gate.py snapshot

      - name: Cache embedding model
        if: needs.plan.outputs.mode != 'skip'
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: minilm-l6-v2-onnx-fp32

      - name: Collect the results
        if: needs.plan.outputs.mode == 'full'
        continue-on-error: true  # no university finished at all: the assemble step then pauses the run
        uses: actions/download-artifact@v4
        with:
          pattern: partial-*
          path: partials

      # Exit 75 = a university has not finished (time budget): publish nothing, the next run resumes it.
      - name: Assemble the full index
        id: assemble
        if: needs.plan.outputs.mode == 'full'
        run: |
          set +e
          python scripts/assemble.py --partials partials --expect "${{ needs.plan.outputs.jobs }}" \
            --per-institution "${{ needs.plan.outputs.per_institution }}" --window-years "${{ needs.plan.outputs.window_years }}" \
            --size-budget-mb "${{ needs.plan.outputs.size_budget_mb }}" --search-index-rows "${{ needs.plan.outputs.search_index_rows }}"
          code=$?
          if [ "$code" = 75 ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Some universities are not finished; nothing was published. The next run resumes them."
            exit 0
          fi
          exit $code

      - name: Monthly CDC update
        if: needs.plan.outputs.mode == 'cdc'
        run: python scripts/cdc_update.py

      - name: Build search index
        if: needs.plan.outputs.mode != 'skip' && steps.assemble.outputs.paused != 'true'
        run: python scripts/build_search_index.py

      # Blocks publishing a broken build (missing files, lost people, over budget) and writes
      # pipeline_status.json, which the site shows. Set the QUALITY_ALLOW_SHRINK variable to 1 for an intended shrink.
      - name: Quality gate
        if: needs.plan.outputs.mode != 'skip' && steps.assemble.outputs.paused != 'true'
        env:
          QUALITY_ALLOW_SHRINK: ${{ vars.QUALITY_ALLOW_SHRINK }}
        run: python scripts/quality_gate.py check --mode "${{ needs.plan.outputs.mode }}" --budget-mb "${{ needs.plan.outputs.size_budget_mb }}"

      # Matches the 2026 Fields Medal and Nobel Prize winners (eval/laureates.json) against the fresh data and
      # writes laureate_eval.json, whose pass/fail marker the site's Demo tab shows. A failing marker does not
      # block publishing; the step is allowed to fail so a crash only leaves status "error".
      - name: Laureate test
        if: needs.plan.outputs.mode != 'skip' && steps.assemble.outputs.paused != 'true'
        continue-on-error: true
        uses: ./.github/actions/laureate-test

      # Also runs on a skipped plan the first time, to seed an empty dataset with the current data.
      - name: Publish data to Hugging Face
        if: >
          env.HF_DATASET_REPO != '' && ((needs.plan.outputs.mode != 'skip' && steps.assemble.outputs.paused != 'true')
          || steps.hf_pull.outputs.empty == 'true')
        run: python scripts/hf_sync.py push --message "${{ needs.plan.outputs.mode }} update $(date -u +%Y-%m-%d)"

      - name: Commit updated data
        id: commit
        if: needs.plan.outputs.mode != 'skip' && steps.assemble.outputs.paused != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # With Hugging Face hosting only config changes are committed; the data is in the dataset.
          if [ -n "$HF_DATASET_REPO" ]; then git add scripts/config; else git add public/data scripts/config; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "data: ${{ needs.plan.outputs.mode }} update $(date -u +%Y-%m-%d)"
            # main may have moved during a long build; data files are only written here.
            # --autostash: with Hugging Face hosting the generated public/data files stay uncommitted.
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the
      # Pages deployment explicitly (workflow_dispatch is the documented exception).
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"

      # One open "data-pipeline" issue while the pipeline is failing; closed again by the next good run.
      - name: Open an issue when the run fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-pipeline --color B60205 --description "Data pipeline run failed" || true
          body="The data pipeline run failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -f .cache/quality_gate_report.md ]; then body="$body"$'\n\n'"$(cat .cache/quality_gate_report.md)"; fi
          existing=$(gh issue list --label data-pipeline --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label data-pipeline --title "Data pipeline run failed" --body "$body"
          fi

      - name: Close the pipeline issue after a good run
        if: success() && needs.plan.outputs.mode != 'skip' && steps.assemble.outputs.paused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label data-pipeline --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Fixed by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done
