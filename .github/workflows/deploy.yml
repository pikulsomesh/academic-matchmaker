name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # onnxruntime-node (a transformers.js dependency used only in Node)
          # downloads native binaries the browser build never needs.
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm test
      - run: npm run build
        env:
          # With the data hosted in a Hugging Face dataset (scripts/hf_sync.py), the site reads it from
          # there and falls back to the bundled public/data while the dataset is empty.
          VITE_DATA_URL: ${{ vars.HF_DATASET_REPO && format('https://huggingface.co/datasets/{0}/resolve/main/', vars.HF_DATASET_REPO) || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
